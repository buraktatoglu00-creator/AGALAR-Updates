name: AGALAR Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'AGALAR-Kaynak.zip'
      - 'patches/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agalar-release
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Unpack original source and apply patches
        shell: bash
        run: |
          set -euo pipefail
          test -f AGALAR-Kaynak.zip || { echo 'Upload AGALAR-Kaynak.zip first'; exit 1; }
          mkdir -p src
          unzip -q AGALAR-Kaynak.zip -d src
          if test -d patches; then
            for p in patches/*.patch; do
              test -f "$p" || continue
              (cd src && patch -p1 --batch < "../$p")
            done
          fi
          test -f src/go.mod
      - name: Test and build Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          cd src
          go test ./...
          VERSION=$(sed -n 's/^const appVersion = "\([0-9.]*\)"/\1/p' config.go)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H windowsgui -s -w' -o ../AGALAR.exe .
          cd ..
          python3 - <<'PY'
          import hashlib, json, os
          with open('AGALAR.exe','rb') as f: content=f.read()
          with open('app-manifest.json','w',encoding='utf-8') as f:
              json.dump({'version': os.environ['VERSION'],'file':'AGALAR.exe','size':len(content),'sha256':hashlib.sha256(content).hexdigest()},f,indent=2)
          PY
      - name: Publish app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="app-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite"
          else
            gh release create "$TAG" AGALAR.exe app-manifest.json --title "AGALAR Manager v${VERSION}" --notes "Windows 10/11 - Tek EXE - Forge 1.20.1"
          fi
