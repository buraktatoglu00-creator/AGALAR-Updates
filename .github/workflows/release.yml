name: AGALAR Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'AGALAR-Kaynak.zip'
      - 'AGALAR-Kaynak-v*.zip'
      - 'patches/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agalar-release
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Unpack original source and apply patches
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(find . -maxdepth 1 -name 'AGALAR-Kaynak-v*.zip' -print | sort -V | tail -n 1)
          if test -z "$SOURCE"; then SOURCE='AGALAR-Kaynak.zip'; fi
          test -f "$SOURCE" || { echo 'Upload an AGALAR source ZIP first'; exit 1; }
          echo "Building from $SOURCE"
          mkdir -p src
          unzip -q "$SOURCE" -d src
          # Complete source archives since v1.3.0 already contain all changes.
          # Never apply legacy v1.1-v1.2 patches to a complete new archive.
          SOURCE_VERSION=$(sed -n 's/^const appVersion = "\\([0-9.]*\\)"/\\1/p' src/config.go)
          if test -z "$SOURCE_VERSION"; then echo "Missing appVersion"; exit 1; fi
          FIRST=$(printf '%s\n' "1.3.0" "$SOURCE_VERSION" | sort -V | head -n 1)
          if [[ "$FIRST" == "1.3.0" ]]; then
            echo "Complete source $SOURCE_VERSION: skipping legacy patches"
          elif test -d patches; then
            for p in patches/*.patch; do
              test -f "$p" || continue
              (cd src && patch -p1 --batch < "../$p")
            done
            if [[ "$SOURCE" == "./AGALAR-Kaynak-v1.1.0.zip" ]]; then
              # Apply compressed feature patches in semantic-version order.
              # The baseline v1.1.0 source is deliberately used until a newer
              # full ZIP is uploaded. Patches are cumulative (1.2.0 -> 1.2.1).
              for p in $(find patches -maxdepth 1 -name '*.xz.b64' | sort -V); do
                base64 -d "$p" | xz -d | (cd src && patch -p1 --batch)
              done
            fi
          fi
          test -f src/go.mod
      - name: Test and build Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          cd src
          go test ./...
          VERSION=$(sed -n 's/^const appVersion = "\([0-9.]*\)"/\1/p' config.go)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H windowsgui -s -w' -o ../AGALAR.exe .
          cd ..
          python3 - <<'PY'
          import hashlib, json, os
          with open('AGALAR.exe','rb') as f: content=f.read()
          with open('app-manifest.json','w',encoding='utf-8') as f:
              json.dump({'version': os.environ['VERSION'],'file':'AGALAR.exe','size':len(content),'sha256':hashlib.sha256(content).hexdigest()},f,indent=2)
          PY
      - name: Publish app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="app-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite"
          else
            gh release create "$TAG" AGALAR.exe app-manifest.json --title "AGALAR Manager v${VERSION}" --notes "Windows 10/11 - Tek EXE - Forge 1.20.1"
          fi
